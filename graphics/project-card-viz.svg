<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Visualization Chatbot — LangChain data explorer">
  <title>Visualization Chatbot — LangChain data explorer</title>
  <defs>
    <linearGradient id="vz-surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101B2E"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>

    <linearGradient id="vz-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="vz-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>

    <clipPath id="vz-card"><rect x="1" y="1" width="898" height="258" rx="16"/></clipPath>
    <clipPath id="vz-window"><rect x="44" y="52" width="212" height="124" rx="8"/></clipPath>

    <style>
      text { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .kicker { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; fill: #5EEAD4; }
      .title  { font-size: 24px; font-weight: 700; fill: #F8FAFC; }
      .body   { font-size: 13.5px; font-weight: 400; fill: #A9B6CA; }
      .chip   { font-size: 11px; font-weight: 600; letter-spacing: 0.3px; fill: #CBD5E1; text-anchor: middle; }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="258" rx="16" fill="url(#vz-surface)" stroke="#1E2C45"/>

  <g clip-path="url(#vz-card)">
    <rect x="1" y="1" width="300" height="258" fill="#0A101C"/>
    <rect x="300" y="1" width="1" height="258" fill="#1E2C45"/>
    <rect x="1" y="1" width="4" height="258" fill="url(#vz-accent)"/>
  </g>

  <!-- dashboard window -->
  <g clip-path="url(#vz-window)">
    <rect x="44" y="52" width="212" height="124" fill="#0B1220"/>
    <rect x="44" y="52" width="212" height="22" fill="#131F35"/>
    <path d="M44 74 H256" stroke="#23324D" stroke-width="1"/>
    <circle cx="58" cy="63" r="3.5" fill="#2DD4BF" fill-opacity="0.6"/>
    <circle cx="70" cy="63" r="3.5" fill="#334155"/>
    <circle cx="82" cy="63" r="3.5" fill="#334155"/>

    <g stroke="#1A263D" stroke-width="1">
      <path d="M56 104 H244"/>
      <path d="M56 133 H244"/>
    </g>

    <g fill="url(#vz-bar)" opacity="0.75">
      <rect x="62"  y="128" width="16" height="34" rx="3"/>
      <rect x="88"  y="110" width="16" height="52" rx="3"/>
      <rect x="114" y="132" width="16" height="30" rx="3"/>
      <rect x="140" y="96"  width="16" height="66" rx="3"/>
      <rect x="166" y="118" width="16" height="44" rx="3"/>
      <rect x="192" y="104" width="16" height="58" rx="3"/>
    </g>

    <path d="M70 116 L96 98 L122 108 L148 84 L174 92 L200 76"
          fill="none" stroke="#2DD4BF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#0B1220" stroke="#2DD4BF" stroke-width="2">
      <circle cx="70"  cy="116" r="3"/>
      <circle cx="96"  cy="98"  r="3"/>
      <circle cx="122" cy="108" r="3"/>
      <circle cx="148" cy="84"  r="3"/>
      <circle cx="174" cy="92"  r="3"/>
      <circle cx="200" cy="76"  r="3"/>
    </g>

    <path d="M56 162 H244" stroke="#23324D" stroke-width="1.5"/>
  </g>
  <rect x="44" y="52" width="212" height="124" rx="8" fill="none" stroke="#23324D" stroke-width="1.5"/>

  <!-- natural-language prompt -->
  <g>
    <rect x="44" y="188" width="212" height="22" rx="11" fill="#131F35" stroke="#26364F"/>
    <path d="M58 195 L63 199 L58 203" fill="none" stroke="#2DD4BF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="72" y="196" width="118" height="6" rx="3" fill="#334155"/>
    <circle cx="240" cy="199" r="10" fill="url(#vz-accent)"/>
    <path d="M236 199 H244 M241 196 L244 199 L241 202" fill="none" stroke="#0B1220" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- content -->
  <text x="336" y="56" class="kicker">LANGCHAIN DATA EXPLORER</text>
  <text x="336" y="88" class="title">Visualization Chatbot</text>
  <rect x="336" y="100" width="44" height="3" rx="1.5" fill="url(#vz-accent)"/>

  <g>
    <circle cx="340" cy="128" r="3" fill="#2DD4BF"/>
    <text x="354" y="132" class="body">Natural-language queries into live Plotly charts</text>

    <circle cx="340" cy="154" r="3" fill="#3B82F6"/>
    <text x="354" y="158" class="body">Reproducible, inspectable data transforms</text>

    <circle cx="340" cy="180" r="3" fill="#6366F1"/>
    <text x="354" y="184" class="body">Session-aware conversational exploration</text>
  </g>

  <g>
    <rect x="336" y="208" width="82" height="24" rx="12" fill="#131F35" stroke="#26364F"/>
    <text x="377" y="224" class="chip">LangChain</text>

    <rect x="428" y="208" width="62" height="24" rx="12" fill="#131F35" stroke="#26364F"/>
    <text x="459" y="224" class="chip">Pandas</text>

    <rect x="500" y="208" width="62" height="24" rx="12" fill="#131F35" stroke="#26364F"/>
    <text x="531" y="224" class="chip">Plotly</text>

    <rect x="572" y="208" width="62" height="24" rx="12" fill="#131F35" stroke="#26364F"/>
    <text x="603" y="224" class="chip">Python</text>
  </g>
</svg>
