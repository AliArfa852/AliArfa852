<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Mulazmat — AI resume parser and candidate ranking">
  <title>Mulazmat — AI resume parser and candidate ranking</title>
  <defs>
    <linearGradient id="mz-surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101B2E"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>

    <linearGradient id="mz-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>

    <clipPath id="mz-card"><rect x="1" y="1" width="898" height="258" rx="16"/></clipPath>

    <style>
      text { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .kicker { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; fill: #5EEAD4; }
      .title  { font-size: 24px; font-weight: 700; fill: #F8FAFC; }
      .body   { font-size: 13.5px; font-weight: 400; fill: #A9B6CA; }
      .chip   { font-size: 11px; font-weight: 600; letter-spacing: 0.3px; fill: #CBD5E1; text-anchor: middle; }
      .tag    { font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #94A3B8; text-anchor: middle; }
      .rank   { font-size: 10px; font-weight: 700; fill: #0B1220; text-anchor: middle; }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="258" rx="16" fill="url(#mz-surface)" stroke="#1E2C45"/>

  <g clip-path="url(#mz-card)">
    <rect x="1" y="1" width="300" height="258" fill="#0A101C"/>
    <rect x="300" y="1" width="1" height="258" fill="#1E2C45"/>
    <rect x="1" y="1" width="4" height="258" fill="url(#mz-accent)"/>
  </g>

  <!-- parsed resume -->
  <rect x="44" y="52" width="100" height="124" rx="8" fill="#101B2E" stroke="#23324D" stroke-width="1.5"/>
  <circle cx="64" cy="74" r="9" fill="#16233A" stroke="#2DD4BF" stroke-width="1.3"/>
  <rect x="80" y="68" width="48" height="6" rx="3" fill="#64748B"/>
  <rect x="80" y="80" width="32" height="5" rx="2.5" fill="#3A4A63"/>
  <path d="M56 96 H132" stroke="#23324D" stroke-width="1"/>
  <g fill="#2E3E56">
    <rect x="56" y="106" width="76" height="5" rx="2.5"/>
    <rect x="56" y="118" width="60" height="5" rx="2.5"/>
    <rect x="56" y="130" width="70" height="5" rx="2.5"/>
    <rect x="56" y="160" width="54" height="5" rx="2.5"/>
  </g>
  <g fill="#2DD4BF" fill-opacity="0.3">
    <rect x="56" y="143" width="28" height="10" rx="5"/>
    <rect x="88" y="143" width="22" height="10" rx="5"/>
    <rect x="114" y="143" width="18" height="10" rx="5"/>
  </g>

  <!-- match links -->
  <g fill="none" stroke="#26364F" stroke-width="1.4">
    <path d="M144 114 C152 114 150 70 158 70"/>
    <path d="M144 114 H158"/>
    <path d="M144 114 C152 114 150 158 158 158"/>
  </g>

  <!-- ranked candidates -->
  <g>
    <rect x="158" y="55" width="98" height="30" rx="8" fill="#131F35" stroke="#26364F"/>
    <circle cx="175" cy="70" r="9" fill="#2DD4BF" fill-opacity="0.9"/>
    <text x="175" y="73.5" class="rank">1</text>
    <rect x="192" y="66" width="52" height="8" rx="4" fill="#22304A"/>
    <rect x="192" y="66" width="46" height="8" rx="4" fill="#2DD4BF" fill-opacity="0.9"/>

    <rect x="158" y="99" width="98" height="30" rx="8" fill="#131F35" stroke="#26364F"/>
    <circle cx="175" cy="114" r="9" fill="#3B82F6" fill-opacity="0.9"/>
    <text x="175" y="117.5" class="rank">2</text>
    <rect x="192" y="110" width="52" height="8" rx="4" fill="#22304A"/>
    <rect x="192" y="110" width="34" height="8" rx="4" fill="#3B82F6" fill-opacity="0.9"/>

    <rect x="158" y="143" width="98" height="30" rx="8" fill="#131F35" stroke="#26364F"/>
    <circle cx="175" cy="158" r="9" fill="#6366F1" fill-opacity="0.9"/>
    <text x="175" y="161.5" class="rank">3</text>
    <rect x="192" y="154" width="52" height="8" rx="4" fill="#22304A"/>
    <rect x="192" y="154" width="22" height="8" rx="4" fill="#6366F1" fill-opacity="0.9"/>
  </g>

  <g>
    <rect x="44" y="188" width="64" height="22" rx="11" fill="#131F35" stroke="#26364F"/>
    <text x="76" y="203" class="tag">PARSE</text>

    <rect x="118" y="188" width="64" height="22" rx="11" fill="#131F35" stroke="#26364F"/>
    <text x="150" y="203" class="tag">RANK</text>

    <rect x="192" y="188" width="64" height="22" rx="11" fill="#131F35" stroke="#26364F"/>
    <text x="224" y="203" class="tag">MATCH</text>
  </g>

  <!-- content -->
  <text x="336" y="56" class="kicker">NCAI-FUNDED · AI RECRUITER</text>
  <text x="336" y="88" class="title">Mulazmat — AI Resume Parser</text>
  <rect x="336" y="100" width="44" height="3" rx="1.5" fill="url(#mz-accent)"/>

  <g>
    <circle cx="340" cy="128" r="3" fill="#2DD4BF"/>
    <text x="354" y="132" class="body">BERT-based skill extraction from resumes</text>

    <circle cx="340" cy="154" r="3" fill="#3B82F6"/>
    <text x="354" y="158" class="body">Hybrid rule-based + ML candidate ranking</text>

    <circle cx="340" cy="180" r="3" fill="#6366F1"/>
    <text x="354" y="184" class="body">Extended with an AI interview agent</text>
  </g>

  <g>
    <rect x="336" y="208" width="50" height="24" rx="12" fill="#131F35" stroke="#26364F"/>
    <text x="361" y="224" class="chip">BERT</text>

    <rect x="396" y="208" width="101" height="24" rx="12" fill="#131F35" stroke="#26364F"/>
    <text x="446" y="224" class="chip">scikit-learn</text>

    <rect x="507" y="208" width="56" height="24" rx="12" fill="#131F35" stroke="#26364F"/>
    <text x="535" y="224" class="chip">Flask</text>

    <rect x="573" y="208" width="46" height="24" rx="12" fill="#131F35" stroke="#26364F"/>
    <text x="596" y="224" class="chip">NLP</text>
  </g>
</svg>
