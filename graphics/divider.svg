<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="Section divider">
  <title>Section divider</title>
  <defs>
    <linearGradient id="dv-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="dv-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="dv-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <rect x="0" y="11" width="576" height="2" rx="1" fill="url(#dv-left)"/>
  <rect x="624" y="11" width="576" height="2" rx="1" fill="url(#dv-right)"/>
  <rect x="593" y="5" width="14" height="14" rx="3" fill="url(#dv-mark)" transform="rotate(45 600 12)"/>
</svg>
