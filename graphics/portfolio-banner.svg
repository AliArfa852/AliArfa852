<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="Ali Arfa — AI/ML Engineer">
  <title>Ali Arfa — AI/ML Engineer</title>
  <defs>
    <linearGradient id="bn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A101C"/>
      <stop offset="0.5" stop-color="#111C30"/>
      <stop offset="1" stop-color="#0A101C"/>
    </linearGradient>

    <linearGradient id="bn-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>

    <radialGradient id="bn-glow-teal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bn-glow-indigo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <pattern id="bn-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#1B2942" stroke-width="1"/>
    </pattern>

    <style>
      text { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 3.5px; fill: #5EEAD4; }
      .name    { font-size: 84px; font-weight: 700; letter-spacing: -1px; fill: #F8FAFC; }
      .role    { font-size: 24px; font-weight: 400; fill: #94A3B8; }
      .badge   { font-size: 15px; font-weight: 600; fill: #CBD5E1; text-anchor: middle; }
    </style>
  </defs>

  <!-- base -->
  <rect width="1600" height="420" fill="url(#bn-bg)"/>
  <ellipse cx="140" cy="40" rx="520" ry="340" fill="url(#bn-glow-teal)"/>
  <ellipse cx="1480" cy="400" rx="560" ry="360" fill="url(#bn-glow-indigo)"/>
  <rect width="1600" height="420" fill="url(#bn-grid)" opacity="0.55"/>
  <rect width="1600" height="4" fill="url(#bn-accent)"/>

  <!-- right: schematic node graph -->
  <g opacity="0.9">
    <circle cx="1270" cy="230" r="190" fill="none" stroke="#1E2C45" stroke-width="1"/>
    <circle cx="1270" cy="230" r="140" fill="none" stroke="#1E2C45" stroke-width="1"/>

    <g stroke="#2A3B57" stroke-width="1.6" fill="none">
      <path d="M1120 140 L1270 150"/>
      <path d="M1120 230 L1270 150"/>
      <path d="M1120 230 L1270 265"/>
      <path d="M1120 320 L1270 265"/>
      <path d="M1270 150 L1420 210"/>
      <path d="M1270 265 L1420 210"/>
    </g>

    <g fill="#101B2E" stroke-width="2.2">
      <circle cx="1120" cy="140" r="13" stroke="#2DD4BF"/>
      <circle cx="1120" cy="230" r="13" stroke="#2DD4BF"/>
      <circle cx="1120" cy="320" r="13" stroke="#2DD4BF"/>
      <circle cx="1270" cy="150" r="13" stroke="#3B82F6"/>
      <circle cx="1270" cy="265" r="13" stroke="#3B82F6"/>
      <circle cx="1420" cy="210" r="16" stroke="#6366F1"/>
    </g>

    <g>
      <circle cx="1120" cy="140" r="4" fill="#2DD4BF"/>
      <circle cx="1120" cy="230" r="4" fill="#2DD4BF"/>
      <circle cx="1120" cy="320" r="4" fill="#2DD4BF"/>
      <circle cx="1270" cy="150" r="4" fill="#3B82F6"/>
      <circle cx="1270" cy="265" r="4" fill="#3B82F6"/>
      <circle cx="1420" cy="210" r="5" fill="#6366F1"/>
    </g>
  </g>

  <!-- left: identity block -->
  <g>
    <rect x="110" y="118" width="256" height="30" rx="15" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF" stroke-opacity="0.35"/>
    <text x="130" y="138" class="eyebrow">AI / ML ENGINEER</text>

    <text x="110" y="232" class="name">Ali Arfa</text>
    <text x="110" y="278" class="role">LLM &amp; Voice Agents · Edge AI · Production ML Systems</text>

    <g>
      <rect x="110" y="312" width="243" height="40" rx="20" fill="#131F35" stroke="#26364F"/>
      <text x="231" y="337" class="badge">Aleesa.ai — AI Team Lead</text>

      <rect x="367" y="312" width="235" height="40" rx="20" fill="#131F35" stroke="#26364F"/>
      <text x="484" y="337" class="badge">4× National AI Champion</text>

      <rect x="616" y="312" width="210" height="40" rx="20" fill="#131F35" stroke="#26364F"/>
      <text x="721" y="337" class="badge">MQ Sydney · MIT (AI)</text>
    </g>
  </g>
</svg>
