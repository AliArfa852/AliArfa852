<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Enhanced Driver Assist — edge AI driver safety monitoring">
  <title>Enhanced Driver Assist — edge AI driver safety monitoring</title>
  <defs>
    <linearGradient id="eda-surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101B2E"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>

    <linearGradient id="eda-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>

    <clipPath id="eda-card"><rect x="1" y="1" width="898" height="258" rx="16"/></clipPath>
    <clipPath id="eda-view"><rect x="44" y="52" width="212" height="124" rx="8"/></clipPath>

    <style>
      text { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .kicker { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; fill: #5EEAD4; }
      .title  { font-size: 24px; font-weight: 700; fill: #F8FAFC; }
      .body   { font-size: 13.5px; font-weight: 400; fill: #A9B6CA; }
      .chip   { font-size: 11px; font-weight: 600; letter-spacing: 0.3px; fill: #CBD5E1; text-anchor: middle; }
      .tag    { font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #94A3B8; }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="258" rx="16" fill="url(#eda-surface)" stroke="#1E2C45"/>

  <g clip-path="url(#eda-card)">
    <rect x="1" y="1" width="300" height="258" fill="#0A101C"/>
    <rect x="300" y="1" width="1" height="258" fill="#1E2C45"/>
    <rect x="1" y="1" width="4" height="258" fill="url(#eda-accent)"/>
  </g>

  <!-- camera view: road perspective with detections -->
  <g clip-path="url(#eda-view)">
    <rect x="44" y="52" width="212" height="124" fill="#0B1220"/>
    <path d="M44 176 L118 112 L182 112 L256 176 Z" fill="#16233A"/>
    <path d="M44 112 H256" stroke="#1E2C45" stroke-width="1"/>
    <path d="M118 112 L44 176" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.55"/>
    <path d="M182 112 L256 176" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.55"/>
    <path d="M150 176 V112" stroke="#E2E8F0" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="8 10"/>

    <rect x="126" y="106" width="34" height="9" rx="2" fill="#2DD4BF"/>
    <rect x="126" y="118" width="48" height="36" rx="3" fill="none" stroke="#2DD4BF" stroke-width="1.6"/>
    <rect x="186" y="116" width="28" height="22" rx="2" fill="none" stroke="#6366F1" stroke-width="1.4" stroke-opacity="0.85"/>
  </g>

  <g fill="none" stroke="#2DD4BF" stroke-width="2" stroke-opacity="0.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 72 V60 H64"/>
    <path d="M236 60 H248 V72"/>
    <path d="M52 156 V168 H64"/>
    <path d="M236 168 H248 V156"/>
  </g>
  <rect x="44" y="52" width="212" height="124" rx="8" fill="none" stroke="#23324D" stroke-width="1.5"/>

  <!-- detector status -->
  <g>
    <rect x="44" y="188" width="60" height="22" rx="11" fill="#131F35" stroke="#26364F"/>
    <circle cx="57" cy="199" r="3" fill="#2DD4BF"/>
    <text x="66" y="203" class="tag">FACE</text>

    <rect x="112" y="188" width="60" height="22" rx="11" fill="#131F35" stroke="#26364F"/>
    <circle cx="125" cy="199" r="3" fill="#3B82F6"/>
    <text x="134" y="203" class="tag">LANE</text>

    <rect x="180" y="188" width="76" height="22" rx="11" fill="#131F35" stroke="#26364F"/>
    <circle cx="193" cy="199" r="3" fill="#6366F1"/>
    <text x="202" y="203" class="tag">OBD-II</text>
  </g>

  <!-- content -->
  <text x="336" y="56" class="kicker">EDGE AI · COMPUTER VISION</text>
  <text x="336" y="88" class="title">Enhanced Driver Assist</text>
  <rect x="336" y="100" width="44" height="3" rx="1.5" fill="url(#eda-accent)"/>

  <g>
    <circle cx="340" cy="128" r="3" fill="#2DD4BF"/>
    <text x="354" y="132" class="body">Dual-camera drowsiness &amp; distraction detection</text>

    <circle cx="340" cy="154" r="3" fill="#3B82F6"/>
    <text x="354" y="158" class="body">Real-time YOLOv8 + TensorFlow Lite inference on-device</text>

    <circle cx="340" cy="180" r="3" fill="#6366F1"/>
    <text x="354" y="184" class="body">OBD-II telemetry fusion &amp; driving analytics</text>
  </g>

  <g>
    <rect x="336" y="208" width="62" height="24" rx="12" fill="#131F35" stroke="#26364F"/>
    <text x="367" y="224" class="chip">YOLOv8</text>

    <rect x="408" y="208" width="120" height="24" rx="12" fill="#131F35" stroke="#26364F"/>
    <text x="468" y="224" class="chip">TensorFlow Lite</text>

    <rect x="538" y="208" width="88" height="24" rx="12" fill="#131F35" stroke="#26364F"/>
    <text x="582" y="224" class="chip">Coral TPU</text>

    <rect x="636" y="208" width="62" height="24" rx="12" fill="#131F35" stroke="#26364F"/>
    <text x="667" y="224" class="chip">OBD-II</text>
  </g>
</svg>
