<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Voice Call Agent — production LLM voice AI">
  <title>Voice Call Agent — production LLM voice AI</title>
  <defs>
    <linearGradient id="vo-surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101B2E"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>

    <linearGradient id="vo-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="vo-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>

    <clipPath id="vo-card"><rect x="1" y="1" width="898" height="258" rx="16"/></clipPath>

    <style>
      text { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .kicker { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; fill: #5EEAD4; }
      .title  { font-size: 24px; font-weight: 700; fill: #F8FAFC; }
      .body   { font-size: 13.5px; font-weight: 400; fill: #A9B6CA; }
      .chip   { font-size: 11px; font-weight: 600; letter-spacing: 0.3px; fill: #CBD5E1; text-anchor: middle; }
      .tag    { font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #94A3B8; text-anchor: middle; }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="258" rx="16" fill="url(#vo-surface)" stroke="#1E2C45"/>

  <g clip-path="url(#vo-card)">
    <rect x="1" y="1" width="300" height="258" fill="#0A101C"/>
    <rect x="300" y="1" width="1" height="258" fill="#1E2C45"/>
    <rect x="1" y="1" width="4" height="258" fill="url(#vo-accent)"/>
  </g>

  <!-- live audio waveform -->
  <rect x="44" y="52" width="212" height="124" rx="8" fill="#0B1220" stroke="#23324D" stroke-width="1.5"/>
  <path d="M56 114 H244" stroke="#23324D" stroke-width="1"/>

  <g fill="url(#vo-bar)">
    <rect x="55.5" y="106" width="5" height="16" rx="2.5" opacity="0.45"/>
    <rect x="68.5" y="100" width="5" height="28" rx="2.5" opacity="0.55"/>
    <rect x="81.5" y="92"  width="5" height="44" rx="2.5" opacity="0.7"/>
    <rect x="94.5" y="83"  width="5" height="62" rx="2.5" opacity="0.85"/>
    <rect x="107.5" y="74" width="5" height="80" rx="2.5"/>
    <rect x="120.5" y="89" width="5" height="50" rx="2.5" opacity="0.85"/>
    <rect x="133.5" y="98" width="5" height="32" rx="2.5" opacity="0.7"/>
    <rect x="146.5" y="80" width="5" height="68" rx="2.5" opacity="0.9"/>
    <rect x="159.5" y="71" width="5" height="86" rx="2.5"/>
    <rect x="172.5" y="85" width="5" height="58" rx="2.5" opacity="0.85"/>
    <rect x="185.5" y="95" width="5" height="38" rx="2.5" opacity="0.7"/>
    <rect x="198.5" y="102" width="5" height="24" rx="2.5" opacity="0.6"/>
    <rect x="211.5" y="88" width="5" height="52" rx="2.5" opacity="0.75"/>
    <rect x="224.5" y="99" width="5" height="30" rx="2.5" opacity="0.55"/>
    <rect x="237.5" y="105" width="5" height="18" rx="2.5" opacity="0.45"/>
  </g>

  <!-- pipeline -->
  <g stroke="#334155" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M106 199 H116"/>
    <path d="M113 196 L117 199 L113 202"/>
    <path d="M182 199 H192"/>
    <path d="M189 196 L193 199 L189 202"/>
  </g>
  <g>
    <rect x="44" y="188" width="60" height="22" rx="11" fill="#131F35" stroke="#26364F"/>
    <text x="74" y="203" class="tag">STT</text>

    <rect x="120" y="188" width="60" height="22" rx="11" fill="#131F35" stroke="#26364F"/>
    <text x="150" y="203" class="tag">LLM</text>

    <rect x="196" y="188" width="60" height="22" rx="11" fill="#131F35" stroke="#26364F"/>
    <text x="226" y="203" class="tag">TTS</text>
  </g>

  <!-- content -->
  <text x="336" y="56" class="kicker">PRODUCTION LLM VOICE AI</text>
  <text x="336" y="88" class="title">Voice Call Agent</text>
  <rect x="336" y="100" width="44" height="3" rx="1.5" fill="url(#vo-accent)"/>

  <g>
    <circle cx="340" cy="128" r="3" fill="#2DD4BF"/>
    <text x="354" y="132" class="body">Real-time speech pipeline on AWS Bedrock + NovaSonic</text>

    <circle cx="340" cy="154" r="3" fill="#3B82F6"/>
    <text x="354" y="158" class="body">Twilio SIP telephony with multi-tenant routing</text>

    <circle cx="340" cy="180" r="3" fill="#6366F1"/>
    <text x="354" y="184" class="body">Tool-calling over custom knowledge bases</text>
  </g>

  <g>
    <rect x="336" y="208" width="94" height="24" rx="12" fill="#131F35" stroke="#26364F"/>
    <text x="383" y="224" class="chip">AWS Bedrock</text>

    <rect x="440" y="208" width="82" height="24" rx="12" fill="#131F35" stroke="#26364F"/>
    <text x="481" y="224" class="chip">NovaSonic</text>

    <rect x="532" y="208" width="88" height="24" rx="12" fill="#131F35" stroke="#26364F"/>
    <text x="576" y="224" class="chip">Twilio SIP</text>

    <rect x="630" y="208" width="88" height="24" rx="12" fill="#131F35" stroke="#26364F"/>
    <text x="674" y="224" class="chip">TypeScript</text>
  </g>
</svg>
